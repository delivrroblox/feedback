services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4095:4095"
    environment:
      - NODE_ENV=production
      - PORT=4095
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4095/api/health').then(r=>r.ok&&process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
